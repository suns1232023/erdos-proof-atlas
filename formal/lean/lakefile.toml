# lakefile.toml — ErdosAtlas Lean 4 project
#
# Setup after clone:
#   cd formal/lean
#   lake update          # generates lake-manifest.json (commit the result)
#   lake exe cache get
#   lake build
#
# NOTE: Lake expects package settings at the TOP LEVEL of this file.
# A "[package]" table is rejected with "missing required key: name".

name = "ErdosAtlas"
version = "0.1.0"
defaultTargets = ["ErdosAtlas"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.14.0"

[[lean_lib]]
name = "ErdosAtlas"

[[lean_exe]]
name = "Main"
root = "Main"
