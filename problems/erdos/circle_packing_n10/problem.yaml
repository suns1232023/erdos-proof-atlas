id: circle-packing-square-n10
version: "0.1"
description: >
  Pack 10 equal circles in a unit square to maximize the minimum pairwise distance.
  Historical result: de Groot, Peikert & Würtz (1990).

domain:
  type: continuous_discrete_geometry
  ams: [52]

objective:
  type: maximize
  expression: minimum_pairwise_distance

