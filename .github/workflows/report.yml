name: Report

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[symbolic,dev]"
      - run: python scripts/generate_report.py
      - run: python scripts/build_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: |
            results/latest/report.md
            results/latest/manifest.json
