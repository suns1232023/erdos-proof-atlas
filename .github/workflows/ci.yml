
# ci.yml — Main CI workflow for erdos-proof-atlas
#
# REPAIR NOTE (P0 Fix):
#   - Changed all test paths from tests/ to tests/ (canonical)
#   - Removed || true from all mandatory verification steps
#   - Added python -m compileall check
#   - Added strict sorry detection (exit 1 on sorry found)
#   - Separated Python CI from Lean CI

name: CI — Python Tests & Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-compile:
    name: Python Compilation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[symbolic,dev]"

      - name: Compile all Python source
        # REPAIR: Added compileall — catches import errors before tests run
        run: |
          python -m compileall src scripts
          echo "[PASS] Python compilation"

  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    needs: python-compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[symbolic,dev]"

      - name: Run unit tests
        # REPAIR: Uses tests/ (canonical), not test/
        run: |
          python -m pytest tests/unit/ -v --tb=short
          echo "[PASS] Unit tests"

      - name: Run adversarial tests
        run: |
          python -m pytest tests/adversarial/ -v --tb=short
          echo "[PASS] Adversarial tests"

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short
          echo "[PASS] Integration tests"

      - name: Run regression tests
        run: |
          python -m pytest tests/regression/ -v --tb=short
          echo "[PASS] Regression tests"

      - name: Run all tests (summary)
        run: |
          python -m pytest tests/ -q --tb=short
          echo "[PASS] All pytest tests"

  path-consistency:
    name: Repository Path Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run path consistency test
        run: |
          python scripts/check_paths.py
          echo "[PASS] Path consistency"

  audit:
    name: Atlas Audit
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[symbolic,dev]"

      - name: Run atlas audit
        run: |
          python scripts/atlas_audit.py
          echo "[PASS] Atlas audit"

  deepmind-export:
    name: DeepMind Metadata Export
    runs-on: ubuntu-latest
    needs: python-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Export DeepMind metadata
        run: |
          python scripts/export_deepmind.py
          echo "[PASS] DeepMind export"

      - name: Validate DeepMind mapping consistency
        # REPAIR: Added validation that mapped Lean theorem actually exists
        run: |
          python scripts/validate_deepmind_mapping.py
          echo "[PASS] DeepMind mapping validation"
