
# lean-check.yml — Lean 4 formal verification CI workflow
#
# REPAIR V2 (per reviewer):
#   ① Removed "lake exe cache get || true" — strict execution, no error suppression
#   ② sorry detection is now STATUS-AWARE (not a blanket CI fail):
#      - L1/L2/L3: sorry allowed (documented proof gaps)
#      - L4: sorry allowed with explicit marking
#      - L5: sorry causes CI FAIL
#   ③ Added #print axioms check via lake env lean
#   ④ Added Lean project structure validation
#   ⑤ Added canonical theorem name check

name: CI — Lean 4 Formal Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lean-structure:
    name: Lean Project Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required Lean files exist
        run: |
          MISSING=0
          REQUIRED=(
            "formal/lean/lakefile.toml"
            "formal/lean/lean-toolchain"
            "formal/lean/lake-manifest.json"
            "formal/lean/Main.lean"
            "formal/lean/ErdosAtlas/Basic.lean"
            "formal/lean/ErdosAtlas/Geometry/Point.lean"
            "formal/lean/ErdosAtlas/Geometry/Distance.lean"
            "formal/lean/ErdosAtlas/Geometry/UnitSquare.lean"
            "formal/lean/ErdosAtlas/CirclePacking/Definitions.lean"
            "formal/lean/ErdosAtlas/CirclePacking/N10.lean"
            "formal/lean/ErdosAtlas/CirclePacking/Certificate.lean"
            "formal/lean/ErdosAtlas/Audit/Axioms.lean"
          )
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "[FAIL] Missing: $f"
              MISSING=1
            else
              echo "[OK]   $f"
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "[PASS] All required Lean files present"

      - name: Verify lakefile.toml has mathlib [[require]]
        run: |
          if ! grep -q "\[\[require\]\]" formal/lean/lakefile.toml; then
            echo "[FAIL] lakefile.toml missing [[require]] block"
            exit 1
          fi
          if ! grep -q "mathlib" formal/lean/lakefile.toml; then
            echo "[FAIL] lakefile.toml missing mathlib dependency"
            exit 1
          fi
          echo "[PASS] lakefile.toml has mathlib [[require]]"

      - name: Verify canonical theorem name in N10.lean
        run: |
          CANONICAL="circlePacking10MinDistBound"
          if ! grep -q "theorem $CANONICAL" formal/lean/ErdosAtlas/CirclePacking/N10.lean; then
            echo "[FAIL] Canonical theorem '$CANONICAL' not declared in N10.lean"
            exit 1
          fi
          echo "[PASS] Canonical theorem '$CANONICAL' declared"

      - name: Verify no Float in theorem statements
        run: |
          FLOAT_FOUND=0
          while IFS= read -r -d '' file; do
            while IFS= read -r line; do
              if echo "$line" | grep -qE "^(theorem|def )" && echo "$line" | grep -q "Float"; then
                echo "[FAIL] Float in theorem/def: $file: $line"
                FLOAT_FOUND=1
              fi
            done < "$file"
          done < <(find formal/lean/ErdosAtlas -name "*.lean" -print0)
          [ "$FLOAT_FOUND" -eq 0 ] || exit 1
          echo "[PASS] No Float in theorem statements"

      - name: Verify no trivial '→ True' conclusion
        run: |
          if grep -r "→ True\|-> True" formal/lean/ErdosAtlas/ --include="*.lean" -q; then
            echo "[FAIL] Found '→ True' conclusion — placeholder theorem detected"
            grep -rn "→ True\|-> True" formal/lean/ErdosAtlas/ --include="*.lean"
            exit 1
          fi
          echo "[PASS] No '→ True' placeholder conclusions"

  lean-build:
    name: Lean 4 Build (lake build)
    runs-on: ubuntu-latest
    needs: lean-structure
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4 (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean toolchain
        run: |
          lean --version
          lake --version
          echo "[PASS] Lean toolchain available"

      - name: Validate lake-manifest.json
        run: |
          if [ ! -f formal/lean/lake-manifest.json ]; then
            echo "[FAIL] lake-manifest.json missing"
            echo "       Run 'lake update' in formal/lean/ and commit the result"
            exit 1
          fi
          echo "[PASS] lake-manifest.json present"

      - name: Get mathlib cache
        # REPAIR: Removed || true — cache failure is a real error
        run: |
          cd formal/lean
          lake exe cache get
          echo "[PASS] Lean/mathlib cache retrieved"

      - name: Build Lean project
        run: |
          cd formal/lean
          lake build
          echo "[PASS] lake build succeeded"

  lean-sorry-check:
    name: Lean Sorry Check (status-aware)
    runs-on: ubuntu-latest
    needs: lean-build
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4 (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Status-aware sorry detection
        # REPAIR V2: sorry detection is now level-aware, not a blanket fail.
        # L1/L2/L3/L4: sorry is allowed (documented proof gaps)
        # L5: sorry causes CI FAIL
        # Current level is L1 — sorry is expected and allowed.
        run: |
          CURRENT_LEVEL="L1"
          echo "Current formal level: $CURRENT_LEVEL"

          SORRY_COUNT=0
          while IFS= read -r -d '' file; do
            while IFS= read -r line; do
              stripped="${line#"${line%%[![:space:]]*}"}"
              if [[ "$stripped" != --* ]] && echo "$line" | grep -q "sorry"; then
                echo "  [sorry] $file: $line"
                SORRY_COUNT=$((SORRY_COUNT + 1))
              fi
            done < "$file"
          done < <(find formal/lean/ErdosAtlas -name "*.lean" -print0)

          echo "Sorry count: $SORRY_COUNT"

          if [ "$CURRENT_LEVEL" = "L5" ] && [ "$SORRY_COUNT" -gt 0 ]; then
            echo "[FAIL] L5 claimed but $SORRY_COUNT sorry found — CI FAIL"
            exit 1
          elif [ "$SORRY_COUNT" -gt 0 ]; then
            echo "[INFO] $SORRY_COUNT sorry found at level $CURRENT_LEVEL — allowed (not L5)"
          else
            echo "[PASS] No sorry found — L5 candidate"
          fi

      - name: Axiom audit via #print axioms
        # REPAIR V2: Uses Lean kernel inspection, not grep
        run: |
          cd formal/lean
          # Run #print axioms on the canonical theorem
          lake env lean --run - <<'EOF'
          import ErdosAtlas.CirclePacking.N10
          #print axioms ErdosAtlas.CirclePacking.circlePacking10MinDistBound
          EOF
          echo "[PASS] Axiom audit complete (see output above)"

  lean-no-or-true:
    name: Verify No Error Suppression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no || true in CI workflows
        run: |
          if grep -r "|| true" .github/workflows/ | grep -v "^#" | grep -v "^.*#.*|| true"; then
            echo "[FAIL] Found '|| true' in CI workflows — error suppression detected"
            exit 1
          fi
          echo "[PASS] No '|| true' in CI workflows"

      - name: Check no || true in Makefile
        run: |
          if [ -f Makefile ]; then
            # Allow || true only in clean target (removing dirs is OK to suppress)
            VIOLATIONS=$(grep "|| true" Makefile | grep -v "clean\|rm -rf\|find.*delete" || true)
            if [ -n "$VIOLATIONS" ]; then
              echo "[FAIL] Found '|| true' in mandatory Makefile steps:"
              echo "$VIOLATIONS"
              exit 1
            fi
          fi
          echo "[PASS] No problematic '|| true' in Makefile"
