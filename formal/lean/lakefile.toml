
# lakefile.toml — ErdosAtlas Lean 4 project
#
# Setup after clone:
#   cd formal/lean
#   lake update
#   lake exe cache get
#   lake build

[package]
name = "ErdosAtlas"
version = "0.1.0"
defaultTargets = ["ErdosAtlas"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.14.0"

[[lean_lib]]
name = "ErdosAtlas"
globs = ["ErdosAtlas"]

[[lean_exe]]
name = "Main"
root = "Main"
