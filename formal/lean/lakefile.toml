-- lakefile.toml — ErdosAtlas Lean 4 project
--
-- REPAIR V2 (Lean Foundation Fix):
--   ① Added [[require]] mathlib block
--   ② Removed [[lean_exe]] Main (temporarily removed until library build passes)
--   ③ Correct library root structure

[package]
name = "ErdosAtlas"
version = "0.1.0"
defaultTargets = ["ErdosAtlas"]

-- mathlib 依赖（请确保版本与您的 lean-toolchain 一致）
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.14.0"

-- 主库配置
[[lean_lib]]
name = "ErdosAtlas"
roots = ["ErdosAtlas"]
