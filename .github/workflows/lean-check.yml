# lean-check.yml -- Lean 4 formal verification CI workflow
#
# Architecture:
#   project_contract.json -> validate_contract.py -> lean_check.py -> Lake/Lean
#
# This workflow is an ORCHESTRATOR only.
# All validation logic lives in scripts/, not in this YAML.

name: CI -- Lean 4 Formal Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-contract:
    name: Validate Project Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate contract consistency
        # Checks: contract syntax, toolchain, mathlib rev, manifest, executable, modules
        run: python scripts/validate_contract.py

  lean-build:
    name: Lean 4 Build
    runs-on: ubuntu-latest
    needs: validate-contract
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4 (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          cd formal/lean
          lean --version
          lake --version

      - name: Get mathlib cache
        run: |
          cd formal/lean
          lake exe cache get

      - name: Build Lean project
        run: |
          cd formal/lean
          lake build

  lean-verify:
    name: Lean Formal Verification
    runs-on: ubuntu-latest
    needs: lean-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lean 4 (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run canonical Lean checker (L1 level)
        # lean_check.py reads project_contract.json as single source of truth.
        # It does NOT duplicate validation already done by validate_contract.py.
        # Formal level remains L1 -- do not promote to L5.
        run: python scripts/lean_check.py --level L1

      - name: Generate verification report
        run: |
          mkdir -p results/formal
          python scripts/lean_check.py --level L1 --report results/formal/lean_verification.json || true

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-verification-report
          path: results/formal/lean_verification.json
