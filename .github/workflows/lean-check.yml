# lean-check.yml — Lean 4 formal verification CI workflow
# REPAIR FINAL: Delegates to scripts/lean_check.py (reads project_contract.json)
# CI and local validation enforce the SAME contract.
# No hard-coded file lists in CI.

name: CI — Lean 4 Formal Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lean-structure-check:
    name: Lean Project Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify project_contract.json exists
        run: |
          if [ ! -f "formal/lean/project_contract.json" ]; then
            echo "[FAIL] formal/lean/project_contract.json missing"
            echo "       This is the authoritative contract for the Lean project."
            exit 1
          fi
          echo "[PASS] project_contract.json present"
           python3 - << 'PYEOF2'
          import json
          c = json.load(open("formal/lean/project_contract.json"))
          print(f"  project_mode: {c['project_mode']}")
          print(f"  formal_level: {c['current_formal_level']}")
          print(f"  mathlib_rev: {c['mathlib_rev']}")
          print(f"  required_modules: {len(c['required_modules'])} files")
          PYEOF2

      - name: Verify required modules (from project_contract.json)
        run: |
          python3 - << 'PYEOF2'
          import json, sys
          from pathlib import Path
          contract = json.load(open("formal/lean/project_contract.json"))
          missing = []
          for m in contract["required_modules"]:
              if not Path(m).is_file():
                  missing.append(m)
          # Check executable entry
          if contract.get("project_mode") == "library_and_executable":
              exe = contract.get("executable_entry", "")
              if exe and not Path(exe).is_file():
                  lower = exe.replace("Main.lean", "main.lean")
                  if not Path(lower).is_file():
                      missing.append(exe)
                  else:
                      print(f"[WARN] {exe} not found but {lower} exists — needs git mv")
          if missing:
              print(f"[FAIL] Missing required modules: {missing}")
              sys.exit(1)
          print(f"[PASS] All {len(contract['required_modules'])} required modules present")
          PYEOF2

      - name: Verify lakefile.toml is valid TOML with mathlib
        run: |
         python3 - << 'PYEOF2'
          import tomllib
          with open("formal/lean/lakefile.toml", "rb") as f:
              data = tomllib.load(f)
          assert "name" in data, "Missing top-level name"
          assert "version" in data, "Missing top-level version"
          req = data.get("require", [{}])[0]
          assert req.get("name") == "mathlib", "Missing mathlib require"
          print("[PASS] lakefile.toml valid TOML with mathlib")
          print(f"       name={data['name']}, rev={req.get('rev')}")
          PYEOF2  
         
      - name: Verify no trivial True conclusion (comment-aware)
        run: |
          python3 - << 'PYEOF2'
          from pathlib import Path
          import sys
          def strip_comments(text):
              r, i, n, d = [], 0, len(text), 0
              while i < n:
                  if d == 0:
                      if text[i:i+2] == "/-": d += 1; i += 2; r.append(" ")
                      elif text[i:i+2] == "--":
                          while i < n and text[i] != "\n": i += 1
                      else: r.append(text[i]); i += 1
                  else:
                      if text[i:i+2] == "-/": d -= 1; i += 2
                      elif text[i:i+2] == "/-": d += 1; i += 2
                      else:
                          if text[i] == "\n": r.append("\n")
                          i += 1
              return "".join(r)
          violations = []
          for f in Path("formal/lean/ErdosAtlas").rglob("*.lean"):
              s = strip_comments(f.read_text())
              if "\u2192 True" in s or "-> True" in s:
                  violations.append(str(f))
          if violations:
              print(f"[FAIL] Trivial True in: {violations}"); sys.exit(1)
          print("[PASS] No trivial True placeholder conclusions")
          PYEOF2

  lean-build:
    name: Lean 4 Build (lake build)
    runs-on: ubuntu-latest
    needs: lean-structure-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4 (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean toolchain
        run: |
          cd formal/lean
          lean --version
          lake --version
          echo "[PASS] Lean toolchain available"

      - name: Validate lake-manifest.json
        run: |
          if [ ! -f formal/lean/lake-manifest.json ]; then
            echo "[FAIL] lake-manifest.json missing"
            echo "       Run: cd formal/lean && lake update && git add lake-manifest.json"
            exit 1
          fi
          echo "[PASS] lake-manifest.json present"

      - name: Get Lean/mathlib cache
        run: |
          cd formal/lean
          lake exe cache get
          echo "[PASS] Lean cache retrieved"

      - name: Build Lean project
        run: |
          cd formal/lean
          lake build
          echo "[PASS] lake build succeeded"

  lean-sorry-check:
    name: Lean Sorry Detection (status-aware, delegates to lean_check.py)
    runs-on: ubuntu-latest
    needs: lean-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lean 4 (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Run lean_check.py (same as local make lean)
        # CI runs the SAME script as local validation.
        # No duplicate logic. project_contract.json is the single source of truth.
        run: |
          python3 scripts/lean_check.py --level L1
          echo "[PASS] lean_check.py passed at L1"
